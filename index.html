<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terpel - Línea del Tiempo Interactiva</title>
    <!-- Herramientas (No tocar) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @keyframes pulse-glow {
            0%, 100% { opacity: 0.15; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(1.1); }
        }
        .bg-glow { animation: pulse-glow 4s infinite; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        /* =========================================================
           ZONA DE EDICIÓN PARA EL LOGO (BUSCA AQUÍ ABAJO)
           =========================================================
        */

        // 1. Si subiste tu logo a GitHub con el nombre "logo.png", 
        // cambia el null por "./logo.png" (mantén las comillas)
        const URL_LOGO = null; 

        /* =========================================================
           FIN DE LA ZONA DE EDICIÓN
           =========================================================
        */

        const Icon = ({ name, className }) => {
            useEffect(() => { lucide.createIcons(); }, []);
            return <i data-lucide={name} className={className}></i>;
        };

        const TerpelLogo = () => {
            if (URL_LOGO) return <img src={URL_LOGO} className="w-12 h-12 object-contain" alt="Logo" />;
            return (
                <svg viewBox="0 0 100 100" className="w-12 h-12">
                    <circle cx="50" cy="50" r="45" fill="#E30613" />
                    <path d="M70 30 C78 38 80 50 78 60 C75 75 60 85 45 82 C30 79 20 65 23 50 C26 35 40 25 55 28 C62 29 67 33 70 38" fill="#FFD100" />
                </svg>
            );
        };

        const App = () => {
            const [hoveredIndex, setHoveredIndex] = useState(null);

            const milestones = [
                { year: "1968", title: "Origen", desc: "Nace Terpel en Bucaramanga", icon: "building-2", color: "bg-red-600", x: "5%", y: "55%" },
                { year: "1971", title: "Regiones", desc: "Expansión regional en Colombia", icon: "map-pin", color: "bg-red-500", x: "13%", y: "42%" },
                { year: "2001", title: "Estructura", desc: "Constitución Organización Terpel S.A.", icon: "award", color: "bg-red-700", x: "21%", y: "58%" },
                { year: "2006", title: "Ecuador", desc: "Inicio operaciones internacionales", icon: "globe", color: "bg-orange-500", x: "29%", y: "38%" },
                { year: "2007", title: "Panamá", desc: "Llegada al mercado panameño", icon: "globe", color: "bg-orange-600", x: "37%", y: "62%" },
                { year: "2010", title: "Inversión", desc: "Copec: Inversionista mayoritario", icon: "trending-up", color: "bg-slate-700", x: "45%", y: "45%" },
                { year: "2011", title: "R. Dom", desc: "Aviación en Rep. Dominicana", icon: "plane", color: "bg-blue-600", x: "53%", y: "65%" },
                { year: "2015", title: "Perú", desc: "Fortalecimiento región andina", icon: "map-pin", color: "bg-red-600", x: "61%", y: "35%" },
                { year: "2019", title: "Cielos", desc: "Aviación llega a Panamá", icon: "plane", color: "bg-blue-500", x: "69%", y: "62%" },
                { year: "2021", title: "Voltex", desc: "Nueva movilidad en Panamá", icon: "zap", color: "bg-yellow-500", x: "77%", y: "42%" },
                { year: "2024", title: "Sbarro", desc: "Alianza retail en Panamá", icon: "target", color: "bg-red-500", x: "85%", y: "68%" },
                { year: "2025", title: "Total", desc: "Lubricantes TotalEnergies", icon: "droplet", color: "bg-slate-800", x: "93%", y: "48%" }
            ];

            return (
                <div className="w-full h-screen bg-[#05070a] text-white font-sans overflow-hidden relative flex flex-col p-6 md:p-10">
                    <div className="absolute inset-0 overflow-hidden pointer-events-none">
                        <div className="absolute top-[-10%] left-[-5%] w-[50%] h-[50%] bg-red-600/10 rounded-full blur-[100px] bg-glow" />
                    </div>

                    <header className="relative z-20 flex justify-between items-start">
                        <div className="space-y-1">
                            <div className="flex items-center gap-4">
                                <TerpelLogo />
                                <h2 className="text-3xl font-black italic tracking-tighter uppercase text-red-600">Terpel</h2>
                            </div>
                            <h1 className="text-4xl md:text-5xl font-black tracking-tighter leading-none pt-4">
                                MAPPING <span className="text-transparent bg-clip-text bg-gradient-to-r from-red-600 to-yellow-500 italic">EVOLUTION.</span>
                            </h1>
                        </div>
                    </header>

                    <div className="flex-grow relative mt-4">
                        <svg className="absolute inset-0 w-full h-full pointer-events-none opacity-30" viewBox="0 0 1000 400" preserveAspectRatio="none">
                            <path d="M 0 220 Q 150 100 300 200 T 600 180 T 1000 160" fill="none" stroke="url(#canvaGrad)" strokeWidth="2" strokeDasharray="10 5" />
                            <defs>
                                <linearGradient id="canvaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                                    <stop offset="0%" stopColor="#ef4444" />
                                    <stop offset="100%" stopColor="#eab308" />
                                </linearGradient>
                            </defs>
                        </svg>

                        {milestones.map((item, idx) => (
                            <div key={idx} className="absolute transition-all duration-500 z-10" style={{ left: item.x, top: item.y, transform: 'translate(-50%, -50%)' }}
                                 onMouseEnter={() => setHoveredIndex(idx)} onMouseLeave={() => setHoveredIndex(null)}>
                                <div className="relative group cursor-pointer">
                                    <div className={`absolute inset-0 rounded-full blur-2xl transition-all duration-700 ${hoveredIndex === idx ? item.color + ' opacity-80 scale-[2.5]' : 'opacity-0'}`} />
                                    <div className={`w-10 h-10 md:w-14 md:h-14 rounded-2xl border-2 transition-all duration-500 bg-slate-900 flex items-center justify-center ${hoveredIndex === idx ? 'border-white rotate-12 scale-110' : 'border-white/10'}`}>
                                        <Icon name={item.icon} className={`w-5 h-5 md:w-6 md:h-6 ${hoveredIndex === idx ? 'text-white' : 'text-slate-500'}`} />
                                    </div>
                                    <div className={`absolute top-full left-1/2 -translate-x-1/2 pt-3 text-center transition-all duration-300 ${hoveredIndex === idx ? 'opacity-100' : 'opacity-40'}`}>
                                        <span className="text-[10px] font-black tracking-tighter text-white block">{item.year}</span>
                                    </div>
                                    {hoveredIndex === idx && (
                                        <div className="absolute bottom-full left-1/2 -translate-x-1/2 mb-6 w-48 md:w-60 p-5 bg-white rounded-3xl shadow-2xl z-50">
                                            <div className="absolute bottom-[-8px] left-1/2 -translate-x-1/2 w-4 h-4 bg-white rotate-45" />
                                            <div className="relative space-y-2 text-slate-900">
                                                <span className={`text-[9px] font-black px-2 py-0.5 rounded-full text-white uppercase tracking-widest ${item.color}`}>Hito {idx + 1}</span>
                                                <h3 className="text-sm md:text-base font-black leading-tight">{item.title}</h3>
                                                <p className="text-[11px] font-bold text-slate-500 italic">{item.desc}</p>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        ))}
                    </div>

                    <footer className="relative z-20 flex justify-between items-center border-t border-white/5 pt-6 text-slate-500">
                        <div className="flex gap-10">
                            <div className="flex flex-col"><span className="text-2xl font-black text-white">57+</span><span className="text-[8px] uppercase font-bold">Años</span></div>
                            <div className="flex flex-col"><span className="text-2xl font-black text-white">05</span><span className="text-[8px] uppercase font-bold">Países</span></div>
                        </div>
                        <span className="text-[8px] font-mono tracking-widest uppercase">Live_Interactive_V7</span>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
